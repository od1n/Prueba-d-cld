<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Se eliminó maximum-scale/user-scalable=no para no bloquear el zoom
         a usuarios con baja visión (WCAG 1.4.4). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F2D55">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>SistemaGestion — Portal</title>
    <link rel="stylesheet" href="/css/app.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
        .login-wrap { width: 100%; max-width: 380px; }
        .login-logo {
            text-align: center; margin-bottom: 40px;
        }
        .login-logo .logo-icon {
            font-size: 48px; display: block; margin-bottom: 12px;
        }
        .login-logo h1 {
            font-size: 20px; font-weight: 700; color: var(--cyan);
            letter-spacing: 1px;
        }
        .login-logo p {
            font-size: 13px; color: var(--texto-dim); margin-top: 4px;
        }
        .login-card {
            background: var(--fondo-card);
            border: 1px solid var(--borde);
            border-radius: 12px;
            padding: 28px 24px;
        }
        .login-card h2 {
            font-size: 16px; font-weight: 600;
            margin-bottom: 24px; color: var(--texto);
        }
        .network-badge {
            text-align: center; margin-top: 20px;
            font-size: 11px; color: var(--texto-dim);
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .network-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--verde);
            animation: pulse 2s ease infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-logo">
            <span class="logo-icon">⚙</span>
            <h1>SISTEMA GESTIÓN</h1>
            <p>Portal Interno — Red Local</p>
        </div>

        <form class="login-card" id="formLogin" autocomplete="on" novalidate
              aria-labelledby="loginTitulo">
            <h2 id="loginTitulo">Iniciar sesión</h2>

            <div class="msg" id="msg" role="alert" aria-live="polite"></div>

            <div class="input-group">
                <label class="input-label" for="usuario">Usuario</label>
                <input class="input-field" id="usuario" name="usuario" type="text"
                    autocomplete="username" autocapitalize="none"
                    inputmode="text" required
                    placeholder="nombre de usuario" autofocus>
            </div>

            <div class="input-group">
                <label class="input-label" for="contrasena">Contraseña</label>
                <div style="position:relative">
                    <input class="input-field" id="contrasena" name="contrasena" type="password"
                        autocomplete="current-password" required
                        placeholder="••••••••" style="padding-right:44px;">
                    <button type="button" id="btnVerPass"
                        aria-label="Mostrar contraseña" aria-pressed="false"
                        style="position:absolute;right:6px;top:50%;transform:translateY(-50%);
                               width:36px;height:36px;border:none;background:none;
                               color:var(--texto-dim);cursor:pointer;font-size:16px;border-radius:6px;">◐</button>
                </div>
            </div>

            <button class="btn btn-cyan" id="btnLogin" type="submit" style="margin-top: 8px;">
                Entrar →
            </button>
        </form>

        <div class="network-badge">
            <span class="network-dot"></span>
            Solo accesible desde la red de la empresa
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        // Si ya está autenticado, redirigir al dashboard
        if (Auth.isLoggedIn()) {
            window.location.replace('/pages/dashboard.html');
        }

        const formLogin  = document.getElementById('formLogin');
        const btnLogin   = document.getElementById('btnLogin');
        const inpUsuario = document.getElementById('usuario');
        const inpPass    = document.getElementById('contrasena');
        const btnVerPass = document.getElementById('btnVerPass');

        btnVerPass.addEventListener('click', () => {
            const visible = inpPass.type === 'text';
            inpPass.type  = visible ? 'password' : 'text';
            btnVerPass.setAttribute('aria-pressed', String(!visible));
            btnVerPass.setAttribute('aria-label',
                visible ? 'Mostrar contraseña' : 'Ocultar contraseña');
        });

        formLogin.addEventListener('submit', async e => {
            e.preventDefault();
            const u = inpUsuario.value.trim();
            const p = inpPass.value;
            inpUsuario.removeAttribute('aria-invalid');
            inpPass.removeAttribute('aria-invalid');
            if (!u || !p) {
                showMsg('Ingresa usuario y contraseña.', 'error', '#msg');
                if (!u) inpUsuario.setAttribute('aria-invalid', 'true');
                if (!p) inpPass.setAttribute('aria-invalid', 'true');
                (u ? inpPass : inpUsuario).focus();
                return;
            }
            setLoading(btnLogin, true);
            hideMsg('#msg');
            try {
                await Auth.login(u, p);
                window.location.replace('/pages/dashboard.html');
            } catch (err) {
                showMsg(esh(err.message || 'Error desconocido.'), 'error', '#msg');
                inpPass.value = '';
                inpPass.setAttribute('aria-invalid', 'true');
                inpPass.focus();
            } finally {
                setLoading(btnLogin, false);
            }
        });
    </script>
</body>
</html>
