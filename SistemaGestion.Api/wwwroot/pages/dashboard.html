<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F2D55">
    <title>Dashboard — SistemaGestion</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app" id="app">
    <div class="loading-msg"><div class="spinner"></div></div>
</div>

<script src="/js/app.js"></script>
<script>
if (!Auth.requireAuth()) { /* redirige */ }

const app = document.getElementById('app');
let autoRefreshTimer = null;

async function render() {
    const user = Auth.getUser();
    app.innerHTML = `
        ${renderTopbar('Dashboard')}
        <div class="content" id="content">
            <div class="loading-msg"><div class="spinner"></div></div>
        </div>
        ${renderNav('dashboard')}`;
    await cargarDatos();
}

async function cargarDatos() {
    const content = document.getElementById('content');
    try {
        const data = await apiGet('/api/dashboard');
        if (!data) return;

        const alertas = data.alertas;
        const hayAlertas = alertas.tieneAlertas;

        content.innerHTML = `
            <!-- Fecha y tasa -->
            <div class="flex-between mb-8">
                <span class="text-dim text-sm">${esh(data.fecha)}</span>
                ${data.tasaCambio ? `
                <span class="text-sm">
                    <span class="text-dim">BCV </span>
                    <span class="mono text-cyan">${formatNum(data.tasaCambio.tasaBCV, 2)}</span>
                </span>` : '<span class="tag tag-naranja">Sin tasa</span>'}
            </div>

            <!-- Banner alertas -->
            ${hayAlertas ? `
            <div class="alert-banner warn" onclick="verAlertas()" style="cursor:pointer">
                <span style="font-size:20px">⚠</span>
                <div>
                    <strong>Alertas activas</strong>
                    <div class="text-sm" style="margin-top:3px">
                        ${alertas.stockBajoCount > 0 ? `${alertas.stockBajoCount} productos bajo mínimo  ` : ''}
                        ${alertas.cxcVencidasCount > 0 ? `${alertas.cxcVencidasCount} CxC vencidas  ` : ''}
                        ${alertas.mantVencidoCount > 0 ? `${alertas.mantVencidoCount} mantenimientos` : ''}
                    </div>
                </div>
                <span style="margin-left:auto;color:var(--naranja)">›</span>
            </div>` : `
            <div class="alert-banner ok">
                <span style="font-size:20px">✓</span>
                <span>Sin alertas activas</span>
            </div>`}

            <!-- KPIs -->
            <div class="kpi-grid">
                <div class="kpi">
                    <div class="kpi-label">Ventas hoy</div>
                    <div class="kpi-value cyan">${formatUSD(data.ventasHoyUsd)}</div>
                </div>
                <div class="kpi">
                    <div class="kpi-label">Facturas emitidas</div>
                    <div class="kpi-value">${data.facturasEmitidas}</div>
                </div>
                <div class="kpi">
                    <div class="kpi-label">CxC vencidas</div>
                    <div class="kpi-value ${data.cxcVencidas > 0 ? 'rojo' : 'verde'}">${data.cxcVencidas}</div>
                </div>
                <div class="kpi">
                    <div class="kpi-label">Stock bajo mín.</div>
                    <div class="kpi-value ${data.stockBajo > 0 ? 'naranja' : 'verde'}">${data.stockBajo}</div>
                </div>
            </div>

            <!-- Accesos rápidos -->
            <div class="card">
                <div class="card-title">Accesos rápidos</div>
                <div class="btn-group">
                    <a href="/pages/kardex.html" class="btn btn-ghost">⇅ Kardex</a>
                    <a href="/pages/inventario.html" class="btn btn-ghost">▦ Stock</a>
                </div>
                <div class="btn-group">
                    <a href="/pages/clientes.html" class="btn btn-ghost">◎ Clientes</a>
                    <a href="/pages/facturas.html" class="btn btn-ghost">▤ Facturas</a>
                </div>
            </div>

            <!-- Refresh -->
            <div style="text-align:center;margin-top:8px">
                <button class="btn btn-ghost" onclick="cargarDatos()" style="width:auto;padding:8px 20px;font-size:13px">
                    ↺ Actualizar
                </button>
            </div>`;

        // Auto-refresh cada 60 segundos
        clearTimeout(autoRefreshTimer);
        autoRefreshTimer = setTimeout(cargarDatos, 60_000);

    } catch (err) {
        content.innerHTML = `
            <div class="alert-banner" role="alert">
                <span>Error al cargar datos: ${esh(err.message)}</span>
            </div>
            <button class="btn btn-ghost btn-full" onclick="cargarDatos()">Reintentar</button>`;
    }
}

async function verAlertas() {
    const data = await apiGet('/api/dashboard/alertas');
    if (!data) return;

    let html = '<div class="modal-handle"></div><div class="modal-title">⚠ Alertas activas</div>';

    if (data.stockBajo?.length > 0) {
        html += `<div class="card-title" style="margin-bottom:8px">📦 Stock bajo (${data.stockBajo.length})</div>`;
        data.stockBajo.forEach(i => {
            html += `<div class="list-item">
                <div class="list-item-main">
                    <div class="list-item-title">${esh(i.descripcion)}</div>
                    <div class="list-item-sub">${esh(i.codigo)}</div>
                </div>
                <div style="text-align:right">
                    <div class="mono" style="color:var(--rojo)">${formatNum(i.actual)}</div>
                    <div class="text-sm text-dim">mín ${formatNum(i.minimo)}</div>
                </div>
            </div>`;
        });
    }

    if (data.cxcVencidas?.length > 0) {
        html += `<hr class="divider"><div class="card-title" style="margin-bottom:8px">💰 CxC vencidas (${data.cxcVencidas.length})</div>`;
        data.cxcVencidas.forEach(c => {
            html += `<div class="list-item">
                <div class="list-item-main">
                    <div class="list-item-title">${esh(c.cliente)}</div>
                    <div class="list-item-sub">${esh(c.concepto)}</div>
                </div>
                <div style="text-align:right">
                    <div class="mono" style="color:var(--rojo)">${formatUSD(c.saldo)}</div>
                    <div class="text-sm text-dim">${formatFecha(c.vencio)}</div>
                </div>
            </div>`;
        });
    }

    html += `<button class="btn btn-ghost btn-full" style="margin-top:16px" onclick="closeModal('alertasModal')">Cerrar</button>`;

    let modal = document.getElementById('alertasModal');
    if (!modal) {
        modal = document.createElement('div');
        modal.id = 'alertasModal';
        modal.className = 'modal-overlay';
        modal.innerHTML = `<div class="modal-drawer" id="alertasDrawer"></div>`;
        document.body.appendChild(modal);
    }
    document.getElementById('alertasDrawer').innerHTML = html;
    openModal('alertasModal');
}

render();
</script>
</body>
</html>
