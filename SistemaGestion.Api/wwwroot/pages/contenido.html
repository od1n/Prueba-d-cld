<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F2D55">
    <title>Estudio de Contenido — SistemaGestion</title>
    <link rel="stylesheet" href="/css/app.css">
    <style>
        /* Estilos propios del módulo Estudio de Contenido */
        .content { padding: 12px 12px 84px; }
        .seg { display: inline-flex; border: 1px solid var(--borde); border-radius: 8px; overflow: hidden; }
        .seg-btn { background: transparent; color: var(--texto-dim); border: none;
                   padding: 6px 12px; cursor: pointer; font-size: 13px; }
        .seg-btn.active { background: var(--cyan); color: #06263f; font-weight: 600; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .kanban { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
        .kanban-col { background: var(--fondo-card); border: 1px solid var(--borde);
                      border-radius: 10px; padding: 10px; }
        .kanban-title { font-size: 13px; margin: 0 0 8px; color: var(--texto); }
        .card-mini { background: var(--fondo-card); border: 1px solid var(--borde);
                     border-radius: 10px; padding: 10px; margin-bottom: 10px; }
        .lista .card-mini { margin-bottom: 8px; }
        .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px;
                 border: 1px solid var(--borde); color: var(--texto-dim); white-space: nowrap; }
        .badge-borrador   { color: #cbd5e1; }
        .badge-generando  { color: #eab308; border-color: #eab308; }
        .badge-en_revision{ color: #38bdf8; border-color: #38bdf8; }
        .badge-aprobado   { color: #a3e635; border-color: #a3e635; }
        .badge-programado { color: #c084fc; border-color: #c084fc; }
        .badge-publicado  { color: #22c55e; border-color: #22c55e; }
        .badge-error      { color: #ef4444; border-color: #ef4444; }
        .empty-state { text-align: center; color: var(--texto-dim); padding: 48px 12px; }
        /* Modales centrados y legibles en desktop (portal es mobile-first) */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 1000; display: none; }
        .modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; padding: 24px; overflow-y: auto; }
        .modal-sheet { background: var(--fondo-card); border: 1px solid var(--borde); border-radius: 14px; padding: 18px; width: 100%; max-width: 560px; margin: auto; }
        .modal-sheet img { max-height: 360px; object-fit: contain; }
        .modal-sheet textarea, .modal-sheet input { width: 100%; box-sizing: border-box; }
        .btn-close { background: transparent; border: none; color: var(--texto-dim); font-size: 18px; cursor: pointer; line-height: 1; }
        .input-label { display: block; font-size: 12px; color: var(--texto-dim); margin-bottom: 4px; }
        .input-group { margin-bottom: 10px; }
        /* Carrusel de assets del post */
        .carrusel { display:flex; flex-direction:column; gap:10px; }
        .asset-item { border:1px solid var(--borde); border-radius:10px; padding:6px; background:#0d1117; }
        .asset-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
        .asset-item img { width:100%; border-radius:8px; background:#111; max-height:360px; object-fit:contain; }
        .asset-add { display:flex; gap:8px; align-items:center; margin:10px 0; flex-wrap:wrap; }
        .acciones-gen { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; border-top:1px solid var(--borde); padding-top:10px; }
        /* Selector de referencias al generar */
        .ref-grid { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0; }
        .ref-pick { position:relative; cursor:pointer; display:inline-block; }
        .ref-pick img { width:76px; height:76px; object-fit:cover; border-radius:8px; background:#111; border:2px solid transparent; display:block; }
        .ref-pick input { position:absolute; top:4px; left:4px; z-index:2; }
        .ref-pick input:checked + img { border-color: var(--cyan); }
        /* Calendario editorial */
        .cal-head { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:4px; }
        .cal-head span { text-align:center; font-size:11px; color:var(--texto-dim); }
        .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
        .cal-cell { min-height:78px; border:1px solid var(--borde); border-radius:8px; padding:4px; background:var(--fondo-card); overflow:hidden; }
        .cal-empty { background:transparent; border:none; }
        .cal-hoy { border-color: var(--cyan); }
        .cal-num { font-size:11px; color:var(--texto-dim); margin-bottom:2px; }
        .cal-chip { font-size:10px; padding:2px 4px; border-radius:6px; margin-bottom:3px; cursor:pointer;
                    border:1px solid var(--borde); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        /* Métricas / insights */
        .metricas-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(84px,1fr)); gap:8px; margin-top:8px; }
        .metric-tile { background:#0d1117; border:1px solid var(--borde); border-radius:10px; padding:8px 6px; text-align:center; }
        .metric-num { font-size:20px; font-weight:700; color:var(--texto); line-height:1.1; }
        .metric-lbl { font-size:11px; color:var(--texto-dim); margin-top:2px; }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="loading-msg"><div class="spinner"></div></div>
</div>
<script src="/js/app.js?v=20260824"></script>
<script src="/js/pages/contenido.js?v=20260824"></script>
</body>
</html>
